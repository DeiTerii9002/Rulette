<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Russian Roulette · Поиск по коду</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: linear-gradient(145deg, #1a3c2c 0%, #0e2a1f 100%);
            font-family: 'Courier New', 'Segoe UI', monospace;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            gap: 20px;
        }
        .rooms-panel {
            width: 300px;
            background: #2d221c;
            border-radius: 40px;
            padding: 20px;
            border: 1px solid #b87a4f;
            height: fit-content;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .rooms-panel h3 { color: #f5e2b9; text-align: center; margin: 0 0 15px; }
        .room-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .room-item {
            background: #1e1713;
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            color: #f0cba0;
            border: 1px solid #bb8855;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
        }
        .room-item:hover { background: #b3592c; color: white; transform: scale(1.02); }
        .room-item.in-game { opacity: 0.6; cursor: not-allowed; background: #5f4a3b; }
        .search-area { margin-bottom: 15px; }
        .search-input {
            width: 100%;
            background: #2e241f;
            border: 2px solid #c9864b;
            padding: 12px;
            border-radius: 60px;
            font-size: 16px;
            color: #ffefcf;
            text-align: center;
            margin-bottom: 10px;
        }
        .search-btn, .create-btn {
            width: 100%;
            background: #b3592c;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .game-container {
            flex: 1;
            background: #2d221c;
            border-radius: 70px;
            padding: 30px 25px;
            border: 1px solid #b87a4f;
        }
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        .auth-box {
            background: #2d221c;
            border: 2px solid #b87a4f;
            border-radius: 60px;
            padding: 40px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        .auth-box h2 { color: #f5e2b9; margin-bottom: 25px; }
        .auth-input {
            width: 100%;
            background: #2e241f;
            border: 2px solid #c9864b;
            padding: 12px 18px;
            border-radius: 60px;
            font-size: 18px;
            color: #ffefcf;
            margin-bottom: 15px;
            outline: none;
        }
        .auth-btn {
            background: #b3592c;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            margin-top: 10px;
        }
        .auth-switch { margin-top: 15px; color: #f0cba0; cursor: pointer; text-decoration: underline; }
        .hidden { display: none; }
        .players-list { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 15px 0; }
        .player-chip {
            background: #45342b;
            padding: 10px 18px;
            border-radius: 50px;
            color: #f0cba0;
            font-weight: bold;
            border-left: 6px solid #d49152;
            transition: 0.2s;
        }
        .player-chip.active { background: #8b4513; border-left-color: gold; box-shadow: 0 0 12px #ffa559; color: #ffefb9; transform: scale(1.05); }
        .player-chip.creator { border-right: 3px solid gold; }
        .status-message {
            background: #000000aa;
            backdrop-filter: blur(8px);
            border-radius: 46px;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            color: #fadfaa;
            margin: 15px 0;
            font-weight: bold;
        }
        .gun { text-align: center; font-size: 70px; letter-spacing: 16px; background: #362217; border-radius: 80px; padding: 15px; margin: 10px 0; }
        .shoot-btn {
            background: #ac3e1c;
            width: 80%;
            padding: 18px;
            font-size: 28px;
            font-weight: bold;
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            display: block;
            margin: 20px auto;
        }
        .shoot-btn.disabled { background: #5f4a3b; opacity: 0.6; cursor: not-allowed; }
        .screamer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: 0s linear;
        }
        .screamer.active { opacity: 1; visibility: visible; }
        .screamer img { width: 100%; height: 100%; object-fit: cover; }
        .logout-btn { background: #5f2e1a; margin-top: 15px; border: none; padding: 8px; border-radius: 30px; color: #f0cba0; cursor: pointer; width: 100%; }
        .back-btn { background: #3a2a22; margin-top: 10px; border: none; padding: 8px; border-radius: 30px; color: #f0cba0; cursor: pointer; width: 100%; }
        @media (max-width: 700px) { body { flex-direction: column; } .rooms-panel { width: 100%; } }
    </style>
</head>
<body>

<div class="rooms-panel">
    <h3>💀 КОМНАТЫ 💀</h3>
    <div class="room-list" id="roomList"></div>
    <div class="search-area">
        <input type="text" id="roomCodeInput" class="search-input" placeholder="Введите код комнаты">
        <button id="joinByCodeBtn" class="search-btn">🔍 ВОЙТИ ПО КОДУ</button>
    </div>
    <button class="create-btn" id="createRoomBtn">🔪 СОЗДАТЬ КОМНАТУ</button>
    <button class="logout-btn" id="logoutBtn">🚪 ВЫЙТИ</button>
</div>

<div class="game-container" id="gameContainer">
    <div id="gameArea" style="display:none;">
        <div class="players-list" id="playersList"></div>
        <div class="status-message" id="statusMsg">Ожидание...</div>
        <div class="gun" id="gunIcon">🔫 💀 🔫</div>
        <div style="text-align:center; margin-bottom:10px;">
            <span style="color:#f0cba0; font-size:18px;">Код комнаты: <strong id="roomCodeDisplay">---</strong></span>
        </div>
        <button id="startGameBtn" class="start-btn hidden" style="background:#b3592c; border:none; padding:12px 25px; border-radius:40px; font-weight:bold; color:white; cursor:pointer; display:block; margin:10px auto;">⚔️ СТАРТ ИГРЫ</button>
        <button id="shootBtn" class="shoot-btn disabled" disabled>💀 ВЫСТРЕЛИТЬ 💀</button>
        <button id="backToRoomsBtn" class="back-btn">🏠 ВЕРНУТЬСЯ К КОМНАТАМ</button>
    </div>
</div>

<div id="screamer" class="screamer">
    <img id="screamerImg" src="/scary.jpeg" alt="SCREAMER">
</div>

<div id="authOverlay" class="auth-overlay">
    <div class="auth-box">
        <h2 id="authTitle">ВХОД</h2>
        <input type="text" id="authUsername" class="auth-input" placeholder="Имя пользователя">
        <input type="password" id="authPassword" class="auth-input" placeholder="Пароль">
        <button id="authSubmitBtn" class="auth-btn">ВОЙТИ</button>
        <div id="authSwitch" class="auth-switch">Нет аккаунта? Зарегистрироваться</div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let currentRoomId = null;
    let myId = null;
    let isCreator = false;
    let gameStarted = false;
    let myTurn = false;
    let currentPlayers = [];
    let currentUser = null;

    const roomListDiv = document.getElementById('roomList');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const gameArea = document.getElementById('gameArea');
    const playersListDiv = document.getElementById('playersList');
    const statusMsgDiv = document.getElementById('statusMsg');
    const startGameBtn = document.getElementById('startGameBtn');
    const shootBtn = document.getElementById('shootBtn');
    const gunIconSpan = document.getElementById('gunIcon');
    const screamerDiv = document.getElementById('screamer');
    const screamerImg = document.getElementById('screamerImg');
    const authOverlay = document.getElementById('authOverlay');
    const authUsername = document.getElementById('authUsername');
    const authPassword = document.getElementById('authPassword');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authSwitch = document.getElementById('authSwitch');
    const authTitle = document.getElementById('authTitle');
    const logoutBtn = document.getElementById('logoutBtn');
    const backToRoomsBtn = document.getElementById('backToRoomsBtn');
    const joinByCodeBtn = document.getElementById('joinByCodeBtn');
    const roomCodeInput = document.getElementById('roomCodeInput');
    const roomCodeDisplay = document.getElementById('roomCodeDisplay');

    let isLoginMode = true;

    function loadUsers() {
        const users = localStorage.getItem('roulette_users');
        return users ? JSON.parse(users) : {};
    }

    function saveUsers(users) {
        localStorage.setItem('roulette_users', JSON.stringify(users));
    }

    function register(username, password) {
        const users = loadUsers();
        if (users[username]) {
            alert('Имя уже занято');
            return false;
        }
        users[username] = password;
        saveUsers(users);
        alert('Регистрация успешна! Теперь войдите.');
        return true;
    }

    function login(username, password) {
        const users = loadUsers();
        if (users[username] && users[username] === password) {
            currentUser = username;
            localStorage.setItem('roulette_current_user', username);
            return true;
        }
        alert('Неверное имя или пароль');
        return false;
    }

    function logout() {
        localStorage.removeItem('roulette_current_user');
        currentUser = null;
        authOverlay.classList.remove('hidden');
        gameArea.style.display = 'none';
        currentRoomId = null;
        isCreator = false;
        gameStarted = false;
        location.reload();
    }

    function checkAutoLogin() {
        const savedUser = localStorage.getItem('roulette_current_user');
        if (savedUser) {
            currentUser = savedUser;
            authOverlay.classList.add('hidden');
            socket.emit('set-user', { username: currentUser, socketId: socket.id });
        } else {
            authOverlay.classList.remove('hidden');
        }
    }

    function playScreamer() {
        if (!screamerDiv) return;
        screamerImg.src = '/scary.jpeg';
        screamerDiv.classList.add('active');
        try {
            let audio = new Audio('https://www.myinstants.com/media/sounds/scream-soundeffect.mp3');
            audio.volume = 0.8;
            audio.play().catch(e => console.log("audio blocked"));
        } catch(e) {}
        setTimeout(() => {
            screamerDiv.classList.remove('active');
        }, 1000);
    }

    function updateRoomsList(rooms) {
        roomListDiv.innerHTML = '';
        rooms.forEach(room => {
            const div = document.createElement('div');
            div.className = 'room-item' + (room.inGame ? ' in-game' : '');
            div.innerHTML = `<span>🎲 ${room.id}</span><span>👥 ${room.playerCount}/6</span>`;
            if (!room.inGame) {
                div.onclick = () => {
                    currentRoomId = room.id;
                    socket.emit('join-room', room.id);
                    gameArea.style.display = 'block';
                };
            }
            roomListDiv.appendChild(div);
        });
    }

    function updatePlayersUI(players) {
        playersListDiv.innerHTML = '';
        players.forEach(p => {
            const chip = document.createElement('div');
            chip.className = 'player-chip';
            if (p.id === myId && p.isCreator) chip.classList.add('creator');
            chip.innerText = p.name + (p.isCreator ? ' 👑' : '');
            if (gameStarted && window.currentTurnId === p.id) chip.classList.add('active');
            playersListDiv.appendChild(chip);
        });
    }

    function updateTurnHighlight() {
        const chips = document.querySelectorAll('.player-chip');
        chips.forEach((chip, idx) => {
            chip.classList.remove('active');
            if (gameStarted && currentPlayers[idx] && currentPlayers[idx].id === window.currentTurnId) {
                chip.classList.add('active');
            }
        });
    }

    function enableShoot(enabled) {
        if (enabled) {
            shootBtn.classList.remove('disabled');
            shootBtn.disabled = false;
        } else {
            shootBtn.classList.add('disabled');
            shootBtn.disabled = true;
        }
    }

    createRoomBtn.onclick = () => {
        if (!currentUser) {
            alert('Сначала авторизуйтесь');
            return;
        }
        socket.emit('create-room');
    };

    joinByCodeBtn.onclick = () => {
        if (!currentUser) {
            alert('Сначала авторизуйтесь');
            return;
        }
        const code = roomCodeInput.value.trim().toUpperCase();
        if (!code) {
            alert('Введите код комнаты');
            return;
        }
        currentRoomId = code;
        socket.emit('join-room', code);
        gameArea.style.display = 'block';
        roomCodeInput.value = '';
    };

    startGameBtn.onclick = () => {
        if (isCreator && !gameStarted && currentRoomId) {
            socket.emit('start-game', currentRoomId);
        }
    };

    shootBtn.onclick = () => {
        if (gameStarted && myTurn && currentRoomId) {
            socket.emit('shoot', currentRoomId);
        }
    };

    backToRoomsBtn.onclick = () => {
        gameArea.style.display = 'none';
        currentRoomId = null;
        isCreator = false;
        gameStarted = false;
        location.reload();
    };

    logoutBtn.onclick = () => logout();

    authSwitch.onclick = () => {
        isLoginMode = !isLoginMode;
        authTitle.innerText = isLoginMode ? 'ВХОД' : 'РЕГИСТРАЦИЯ';
        authSubmitBtn.innerText = isLoginMode ? 'ВОЙТИ' : 'ЗАРЕГИСТРИРОВАТЬСЯ';
        authSwitch.innerText = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
    };

    authSubmitBtn.onclick = () => {
        const username = authUsername.value.trim();
        const password = authPassword.value.trim();
        if (!username || !password) {
            alert('Заполните все поля');
            return;
        }
        if (isLoginMode) {
            if (login(username, password)) {
                authOverlay.classList.add('hidden');
                currentUser = username;
                socket.emit('set-user', { username: currentUser, socketId: socket.id });
                location.reload();
            }
        } else {
            if (register(username, password)) {
                isLoginMode = true;
                authTitle.innerText = 'ВХОД';
                authSubmitBtn.innerText = 'ВОЙТИ';
                authSwitch.innerText = 'Нет аккаунта? Зарегистрироваться';
                authUsername.value = '';
                authPassword.value = '';
            }
        }
    };

    socket.on('connect', () => {
        myId = socket.id;
        if (currentUser) {
            socket.emit('set-user', { username: currentUser, socketId: socket.id });
        }
    });

    socket.on('update-rooms', (rooms) => updateRoomsList(rooms));

    socket.on('room-created', (data) => {
        currentRoomId = data.roomId;
        isCreator = true;
        roomCodeDisplay.innerText = currentRoomId;
        statusMsgDiv.innerText = `✅ Комната ${currentRoomId} создана. Ожидай игроков, потом СТАРТ.`;
        startGameBtn.classList.remove('hidden');
        startGameBtn.style.display = 'block';
        updatePlayersUI(data.players);
        gameArea.style.display = 'block';
    });

    socket.on('players-update', (players) => {
        currentPlayers = players;
        updatePlayersUI(players);
        if (players.length > 0 && roomCodeDisplay.innerText === '---' && currentRoomId) {
            roomCodeDisplay.innerText = currentRoomId;
        }
    });

    socket.on('game-start', (data) => {
        gameStarted = true;
        currentPlayers = data.players;
        updatePlayersUI(currentPlayers);
        myTurn = (data.firstPlayerId === myId);
        if (myTurn) enableShoot(true);
        else enableShoot(false);
        startGameBtn.classList.add('hidden');
        updateTurnHighlight();
        if (myTurn) statusMsgDiv.innerText = "🔫 ТВОЙ ХОД! ЖМИ ВЫСТРЕЛ! 🔫";
        else statusMsgDiv.innerText = "⏳ Ожидаем ход другого игрока... ⏳";
    });

    socket.on('turn-update', (data) => {
        if (!gameStarted) return;
        myTurn = (data.playerId === myId);
        if (myTurn) {
            enableShoot(true);
            statusMsgDiv.innerText = "🔫 ТВОЯ ОЧЕРЕДЬ! СТРЕЛЯЙ! 🔫";
        } else {
            enableShoot(false);
            statusMsgDiv.innerText = "⌛ Ждём оппонента...";
        }
        window.currentTurnId = data.playerId;
        updateTurnHighlight();
    });

    socket.on('shot-fired', (data) => {
        if (data.isDead) {
            gunIconSpan.innerHTML = "💀 💥 💀";
            if (data.playerId === myId) {
                statusMsgDiv.innerText = "💀 ТЫ ПРОИГРАЛ! 💀";
                enableShoot(false);
                playScreamer();
                setTimeout(() => location.reload(), 3000);
            } else {
                statusMsgDiv.innerText = "💀 ИГРОК ВЫБЫЛ! 💀";
            }
        } else {
            gunIconSpan.innerHTML = "🔫 ЩЕЛЧОК! 🔫";
            setTimeout(() => gunIconSpan.innerHTML = "🔫 💀 🔫", 500);
            statusMsgDiv.innerText = "🍀 Осечка... Живой! 🍀";
        }
    });

    socket.on('player-dead', (data) => {
        currentPlayers = data.playersLeft;
        updatePlayersUI(currentPlayers);
        if (data.playerId === myId) {
            gameStarted = false;
            enableShoot(false);
            statusMsgDiv.innerText = "💀 ТЫ ВЫЛЕТЕЛ. ИГРА ОКОНЧЕНА. 💀";
        } else {
            statusMsgDiv.innerText = `☠️ Осталось: ${currentPlayers.length} чел. ☠️`;
            if (data.currentTurnId === myId) {
                myTurn = true;
                enableShoot(true);
                statusMsgDiv.innerText = "🔫 ТВОЙ ХОД! СТРЕЛЯЙ! 🔫";
            }
            if (data.currentTurnId) window.currentTurnId = data.currentTurnId;
            updateTurnHighlight();
        }
    });

    socket.on('game-over', (data) => {
        gameStarted = false;
        enableShoot(false);
        statusMsgDiv.innerText = data.winner ? `🏆 ПОБЕДИТЕЛЬ: ${data.winner}! 🏆` : "💀 ВСЕ МЕРТВЫ. 💀";
        startGameBtn.classList.add('hidden');
        setTimeout(() => location.reload(), 5000);
    });

    socket.on('error', (msg) => alert(msg));

    checkAutoLogin();
</script>
</body>
</html>
