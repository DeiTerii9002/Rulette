<!-- public/index.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Russian Roulette</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: linear-gradient(145deg, #1a3c2c, #0e2a1f);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            gap: 20px;
        }
        .rooms-panel {
            width: 280px;
            background: #2d221c;
            border-radius: 40px;
            padding: 20px;
            border: 1px solid #b87a4f;
            height: fit-content;
        }
        .rooms-panel h3 { color: #f5e2b9; text-align: center; margin: 0 0 15px; }
        .room-list { display: flex; flex-direction: column; gap: 10px; }
        .room-item {
            background: #1e1713;
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            color: #f0cba0;
            border: 1px solid #bb8855;
            transition: 0.2s;
        }
        .room-item:hover { background: #b3592c; color: white; transform: scale(1.02); }
        .room-item.in-game { opacity: 0.6; cursor: not-allowed; background: #5f4a3b; }
        .create-btn {
            width: 100%;
            background: #b3592c;
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
        .game-container {
            flex: 1;
            background: #2d221c;
            border-radius: 70px;
            padding: 30px 25px;
            border: 1px solid #b87a4f;
        }
        .join-area { text-align: center; margin-bottom: 20px; }
        .join-input {
            background: #2e241f;
            border: 2px solid #c9864b;
            padding: 12px 18px;
            border-radius: 60px;
            font-size: 18px;
            color: #ffefcf;
            margin-right: 10px;
            width: 200px;
        }
        .join-btn, .start-btn {
            background: #b3592c;
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .players-list { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 15px 0; }
        .player-chip {
            background: #45342b;
            padding: 10px 18px;
            border-radius: 50px;
            color: #f0cba0;
            font-weight: bold;
            border-left: 6px solid #d49152;
        }
        .player-chip.active { background: #8b4513; border-left-color: gold; box-shadow: 0 0 12px #ffa559; }
        .status-message {
            background: #000000aa;
            backdrop-filter: blur(8px);
            border-radius: 46px;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            color: #fadfaa;
            margin: 15px 0;
        }
        .gun { text-align: center; font-size: 70px; letter-spacing: 16px; background: #362217; border-radius: 80px; padding: 15px; margin: 10px 0; }
        .shoot-btn {
            background: #ac3e1c;
            width: 80%;
            padding: 18px;
            font-size: 28px;
            font-weight: bold;
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            display: block;
            margin: 20px auto;
        }
        .shoot-btn.disabled { background: #5f4a3b; opacity: 0.6; cursor: not-allowed; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="rooms-panel">
    <h3>🏠 ROOMS</h3>
    <div class="room-list" id="roomList"></div>
    <button class="create-btn" id="createRoomBtn">+ CREATE ROOM</button>
</div>
<div class="game-container" id="gameContainer">
    <div id="joinRoomArea" class="join-area">
        <input type="text" id="playerNameInput" class="join-input" placeholder="Your name">
        <button id="joinRoomBtn" class="join-btn">JOIN ROOM</button>
    </div>
    <div id="gameArea" style="display:none;">
        <div class="players-list" id="playersList"></div>
        <div class="status-message" id="statusMsg">Waiting...</div>
        <div class="gun" id="gunIcon">🔫 💀 🔫</div>
        <button id="startGameBtn" class="start-btn hidden">START GAME</button>
        <button id="shootBtn" class="shoot-btn disabled" disabled>PULL TRIGGER</button>
    </div>
</div>

<script>
    const socket = io();
    let currentRoomId = null;
    let myName = null;
    let isCreator = false;
    let gameStarted = false;
    let myTurn = false;

    const roomListDiv = document.getElementById('roomList');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const joinRoomArea = document.getElementById('joinRoomArea');
    const gameArea = document.getElementById('gameArea');
    const playerNameInput = document.getElementById('playerNameInput');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const playersListDiv = document.getElementById('playersList');
    const statusMsgDiv = document.getElementById('statusMsg');
    const startGameBtn = document.getElementById('startGameBtn');
    const shootBtn = document.getElementById('shootBtn');
    const gunIconSpan = document.getElementById('gunIcon');

    function updateRoomsList(rooms) {
        roomListDiv.innerHTML = '';
        rooms.forEach(room => {
            const div = document.createElement('div');
            div.className = 'room-item' + (room.inGame ? ' in-game' : '');
            div.innerHTML = `🎲 Room ${room.id} (${room.playerCount}/6)`;
            if (!room.inGame) div.onclick = () => promptJoinRoom(room.id);
            roomListDiv.appendChild(div);
        });
    }

    function promptJoinRoom(roomId) {
        if (!myName) {
            const name = prompt('Enter your name:');
            if (!name) return;
            myName = name;
        }
        currentRoomId = roomId;
        socket.emit('join-room', { roomId, playerName: myName });
        joinRoomArea.style.display = 'none';
        gameArea.style.display = 'block';
        statusMsgDiv.innerText = 'Joining room...';
    }

    createRoomBtn.onclick = () => {
        let name = playerNameInput.value.trim();
        if (!name) name = prompt('Enter your name:');
        if (!name) return;
        myName = name;
        socket.emit('create-room', myName);
        joinRoomArea.style.display = 'none';
        gameArea.style.display = 'block';
    };

    joinRoomBtn.onclick = () => {
        if (!currentRoomId) {
            alert('Select a room from the list first');
            return;
        }
        const name = playerNameInput.value.trim();
        if (!name) { alert('Enter your name'); return; }
        myName = name;
        socket.emit('join-room', { roomId: currentRoomId, playerName: myName });
        joinRoomArea.style.display = 'none';
        gameArea.style.display = 'block';
    };

    startGameBtn.onclick = () => { if (isCreator && !gameStarted) socket.emit('start-game', currentRoomId); };
    shootBtn.onclick = () => { if (gameStarted && myTurn) socket.emit('shoot', currentRoomId); };

    socket.on('update-rooms', (rooms) => updateRoomsList(rooms));
    socket.on('room-created', (data) => {
        currentRoomId = data.roomId;
        isCreator = true;
        statusMsgDiv.innerText = `Room ${currentRoomId} created. Wait for players, then press START.`;
        startGameBtn.classList.remove('hidden');
        updatePlayersUI(data.players);
    });
    socket.on('players-update', (players) => updatePlayersUI(players));
    socket.on('game-start', (data) => {
        gameStarted = true;
        myTurn = (data.firstTurn === socket.id);
        statusMsgDiv.innerText = `GAME STARTED! First turn: ${myTurn ? 'YOU' : 'wait...'}`;
        if (myTurn) enableShoot(true);
        else enableShoot(false);
        startGameBtn.classList.add('hidden');
    });
    socket.on('turn-update', (data) => {
        if (!gameStarted) return;
        myTurn = (data.playerId === socket.id);
        if (myTurn) { enableShoot(true); statusMsgDiv.innerText = "YOUR TURN! Pull the trigger..."; }
        else { enableShoot(false); statusMsgDiv.innerText = "Waiting for opponent..."; }
    });
    socket.on('shot-fired', (data) => {
        if (data.isDead) {
            gunIconSpan.innerHTML = "💀 💥 💀";
            if (data.playerId === socket.id) { statusMsgDiv.innerText = "YOU DIED!"; enableShoot(false); }
            else statusMsgDiv.innerText = "A player died!";
        } else { gunIconSpan.innerHTML = "🔫 CLICK! 🔫"; setTimeout(() => gunIconSpan.innerHTML = "🔫 💀 🔫", 500); }
    });
    socket.on('player-dead', (data) => {
        updatePlayersUIByName(data.playersLeft);
        if (data.playerId === socket.id) { gameStarted = false; enableShoot(false); statusMsgDiv.innerText = "Game over. You lost."; }
        else statusMsgDiv.innerText = `${data.playersLeft.length} players remain.`;
    });
    socket.on('game-over', (data) => {
        gameStarted = false;
        enableShoot(false);
        statusMsgDiv.innerText = data.winner ? `WINNER: ${data.winner}!` : "Game over!";
        startGameBtn.classList.add('hidden');
        setTimeout(() => location.reload(), 4000);
    });
    socket.on('error', (msg) => { alert(msg); location.reload(); });

    function updatePlayersUI(players) {
        playersListDiv.innerHTML = '';
        players.forEach(p => {
            const chip = document.createElement('div');
            chip.className = 'player-chip' + (p.id === socket.id && gameStarted && myTurn ? ' active' : '');
            chip.innerText = p.name + (p.isCreator ? ' 👑' : '');
            playersListDiv.appendChild(chip);
        });
    }
    function updatePlayersUIByName(names) {
        playersListDiv.innerHTML = '';
        names.forEach(name => {
            const chip = document.createElement('div');
            chip.className = 'player-chip';
            chip.innerText = name;
            playersListDiv.appendChild(chip);
        });
    }
    function enableShoot(enabled) {
        if (enabled) { shootBtn.classList.remove('disabled'); shootBtn.disabled = false; }
        else { shootBtn.classList.add('disabled'); shootBtn.disabled = true; }
    }
</script>
</body>
</html>
