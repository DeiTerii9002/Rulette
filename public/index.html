<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Russian Roulette · Авторизация + Комнаты + Скример</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1a3c2c 0%, #0e2a1f 100%);
            font-family: 'Courier New', 'Segoe UI', monospace;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            gap: 20px;
        }

        .rooms-panel {
            width: 280px;
            background: #2d221c;
            border-radius: 40px;
            padding: 20px;
            border: 1px solid #b87a4f;
            height: fit-content;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            transition: 0.3s;
        }

        .rooms-panel h3 {
            color: #f5e2b9;
            text-align: center;
            margin: 0 0 15px;
        }

        .room-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
        }

        .room-item {
            background: #1e1713;
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            color: #f0cba0;
            border: 1px solid #bb8855;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
        }

        .room-item:hover {
            background: #b3592c;
            color: white;
            transform: scale(1.02);
        }

        .room-item.in-game {
            opacity: 0.6;
            cursor: not-allowed;
            background: #5f4a3b;
        }

        .create-btn {
            width: 100%;
            background: #b3592c;
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
            font-size: 16px;
        }

        .game-container {
            flex: 1;
            background: #2d221c;
            border-radius: 70px;
            padding: 30px 25px;
            border: 1px solid #b87a4f;
        }

        /* АВТОРИЗАЦИЯ */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .auth-box {
            background: #2d221c;
            border: 2px solid #b87a4f;
            border-radius: 60px;
            padding: 40px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        .auth-box h2 {
            color: #f5e2b9;
            margin-bottom: 25px;
        }

        .auth-input {
            width: 100%;
            background: #2e241f;
            border: 2px solid #c9864b;
            padding: 12px 18px;
            border-radius: 60px;
            font-size: 18px;
            color: #ffefcf;
            margin-bottom: 15px;
            outline: none;
        }

        .auth-btn {
            background: #b3592c;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            margin-top: 10px;
        }

        .auth-switch {
            margin-top: 15px;
            color: #f0cba0;
            cursor: pointer;
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        .join-area {
            text-align: center;
            margin-bottom: 20px;
        }

        .join-input {
            background: #2e241f;
            border: 2px solid #c9864b;
            padding: 12px 18px;
            border-radius: 60px;
            font-size: 18px;
            color: #ffefcf;
            margin-right: 10px;
            width: 200px;
        }

        .join-btn, .start-btn {
            background: #b3592c;
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .players-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 15px 0;
        }

        .player-chip {
            background: #45342b;
            padding: 10px 18px;
            border-radius: 50px;
            color: #f0cba0;
            font-weight: bold;
            border-left: 6px solid #d49152;
            transition: 0.2s;
        }

        .player-chip.active {
            background: #8b4513;
            border-left-color: gold;
            box-shadow: 0 0 12px #ffa559;
            color: #ffefb9;
            transform: scale(1.05);
        }

        .player-chip.creator {
            border-right: 3px solid gold;
        }

        .status-message {
            background: #000000aa;
            backdrop-filter: blur(8px);
            border-radius: 46px;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            color: #fadfaa;
            margin: 15px 0;
            font-weight: bold;
        }

        .gun {
            text-align: center;
            font-size: 70px;
            letter-spacing: 16px;
            background: #362217;
            border-radius: 80px;
            padding: 15px;
            margin: 10px 0;
        }

        .shoot-btn {
            background: #ac3e1c;
            width: 80%;
            padding: 18px;
            font-size: 28px;
            font-weight: bold;
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            display: block;
            margin: 20px auto;
        }

        .shoot-btn.disabled {
            background: #5f4a3b;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .screamer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: 0s linear;
        }

        .screamer.active {
            opacity: 1;
            visibility: visible;
        }

        .screamer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logout-btn {
            background: #5f2e1a;
            margin-top: 15px;
            border: none;
            padding: 8px;
            border-radius: 30px;
            color: #f0cba0;
            cursor: pointer;
            width: 100%;
        }

        @media (max-width: 700px) {
            body {
                flex-direction: column;
            }
            .rooms-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="rooms-panel">
    <h3>💀 ИГРОВЫЕ КОМНАТЫ 💀</h3>
    <div class="room-list" id="roomList"></div>
    <button class="create-btn" id="createRoomBtn">🔪 СОЗДАТЬ КОМНАТУ</button>
    <button class="logout-btn" id="logoutBtn">🚪 ВЫЙТИ</button>
</div>

<div class="game-container" id="gameContainer">
    <div id="joinRoomArea" class="join-area">
        <input type="text" id="playerNameInput" class="join-input" placeholder="Твоё имя">
        <button id="joinRoomBtn" class="join-btn">🔫 ВОЙТИ В КОМНАТУ</button>
    </div>
    <div id="gameArea" style="display:none;">
        <div class="players-list" id="playersList"></div>
        <div class="status-message" id="statusMsg">Ожидание...</div>
        <div class="gun" id="gunIcon">🔫 💀 🔫</div>
        <button id="startGameBtn" class="start-btn hidden">⚔️ СТАРТ ИГРЫ</button>
        <button id="shootBtn" class="shoot-btn disabled" disabled>💀 ВЫСТРЕЛИТЬ 💀</button>
    </div>
</div>

<div id="screamer" class="screamer">
    <img id="screamerImg" src="/scary.jpeg" alt="SCREAMER">
</div>

<!-- МОДАЛКА АВТОРИЗАЦИИ -->
<div id="authOverlay" class="auth-overlay">
    <div class="auth-box">
        <h2 id="authTitle">ВХОД</h2>
        <input type="text" id="authUsername" class="auth-input" placeholder="Имя пользователя">
        <input type="password" id="authPassword" class="auth-input" placeholder="Пароль">
        <button id="authSubmitBtn" class="auth-btn">ВОЙТИ</button>
        <div id="authSwitch" class="auth-switch">Нет аккаунта? Зарегистрироваться</div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let currentRoomId = null;
    let myName = null;
    let myId = null;
    let isCreator = false;
    let gameStarted = false;
    let myTurn = false;
    let currentPlayers = [];
    let isLoggedIn = false;
    let currentUser = null;

    // DOM elements
    const roomListDiv = document.getElementById('roomList');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const joinRoomArea = document.getElementById('joinRoomArea');
    const gameArea = document.getElementById('gameArea');
    const playerNameInput = document.getElementById('playerNameInput');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const playersListDiv = document.getElementById('playersList');
    const statusMsgDiv = document.getElementById('statusMsg');
    const startGameBtn = document.getElementById('startGameBtn');
    const shootBtn = document.getElementById('shootBtn');
    const gunIconSpan = document.getElementById('gunIcon');
    const screamerDiv = document.getElementById('screamer');
    const screamerImg = document.getElementById('screamerImg');
    const authOverlay = document.getElementById('authOverlay');
    const authTitle = document.getElementById('authTitle');
    const authUsername = document.getElementById('authUsername');
    const authPassword = document.getElementById('authPassword');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authSwitch = document.getElementById('authSwitch');
    const logoutBtn = document.getElementById('logoutBtn');

    let isLoginMode = true;

    // Регистрация/Вход через localStorage
    function loadUsers() {
        const users = localStorage.getItem('roulette_users');
        return users ? JSON.parse(users) : {};
    }

    function saveUsers(users) {
        localStorage.setItem('roulette_users', JSON.stringify(users));
    }

    function register(username, password) {
        const users = loadUsers();
        if (users[username]) {
            alert('Имя уже занято');
            return false;
        }
        users[username] = password;
        saveUsers(users);
        alert('Регистрация успешна! Теперь войдите.');
        return true;
    }

    function login(username, password) {
        const users = loadUsers();
        if (users[username] && users[username] === password) {
            currentUser = username;
            localStorage.setItem('roulette_current_user', username);
            return true;
        }
        alert('Неверное имя или пароль');
        return false;
    }

    function logout() {
        localStorage.removeItem('roulette_current_user');
        currentUser = null;
        isLoggedIn = false;
        authOverlay.classList.remove('hidden');
        location.reload();
    }

    function checkAutoLogin() {
        const savedUser = localStorage.getItem('roulette_current_user');
        if (savedUser) {
            currentUser = savedUser;
            isLoggedIn = true;
            authOverlay.classList.add('hidden');
            myName = currentUser;
            playerNameInput.value = myName;
            socket.emit('set-user', { username: currentUser, socketId: socket.id });
        } else {
            authOverlay.classList.remove('hidden');
        }
    }

    // Скример
    function playScreamer() {
        if (!screamerDiv) return;
        screamerImg.src = '/scary.jpeg';
        screamerDiv.classList.add('active');
        try {
            let audio = new Audio('https://www.myinstants.com/media/sounds/scream-soundeffect.mp3');
            audio.volume = 0.8;
            audio.play().catch(e => console.log("audio blocked"));
        } catch(e) {}
        setTimeout(() => {
            screamerDiv.classList.remove('active');
        }, 1000);
    }

    function updateRoomsList(rooms) {
        roomListDiv.innerHTML = '';
        rooms.forEach(room => {
            const div = document.createElement('div');
            div.className = 'room-item' + (room.inGame ? ' in-game' : '');
            div.innerHTML = `<span>🎲 ${room.id}</span><span>👥 ${room.playerCount}/6</span>`;
            if (!room.inGame) {
                div.onclick = () => promptJoinRoom(room.id);
            }
            roomListDiv.appendChild(div);
        });
    }

    function promptJoinRoom(roomId) {
        if (!currentUser) {
            alert('Сначала авторизуйтесь');
            return;
        }
        myName = currentUser;
        currentRoomId = roomId;
        socket.emit('join-room', { roomId, playerName: myName });
        joinRoomArea.style.display = 'none';
        gameArea.style.display = 'block';
        statusMsgDiv.innerText = 'Присоединение...';
    }

    createRoomBtn.onclick = () => {
        if (!currentUser) {
            alert('Сначала авторизуйтесь');
            return;
        }
        myName = currentUser;
        socket.emit('create-room', myName);
        joinRoomArea.style.display = 'none';
        gameArea.style.display = 'block';
        statusMsgDiv.innerText = 'Создание комнаты...';
    };

    joinRoomBtn.onclick = () => {
        if (!currentUser) {
            alert('Сначала авторизуйтесь');
            return;
        }
        if (!currentRoomId) {
            alert('Сначала выбери комнату слева');
            return;
        }
        myName = currentUser;
        socket.emit('join-room', { roomId: currentRoomId, playerName: myName });
        joinRoomArea.style.display = 'none';
        gameArea.style.display = 'block';
    };

    startGameBtn.onclick = () => {
        if (isCreator && !gameStarted) socket.emit('start-game', currentRoomId);
    };

    shootBtn.onclick = () => {
        if (gameStarted && myTurn) socket.emit('shoot', currentRoomId);
    };

    logoutBtn.onclick = () => logout();

    // Auth UI
    authSwitch.onclick = () => {
        isLoginMode = !isLoginMode;
        authTitle.innerText = isLoginMode ? 'ВХОД' : 'РЕГИСТРАЦИЯ';
        authSubmitBtn.innerText = isLoginMode ? 'ВОЙТИ' : 'ЗАРЕГИСТРИРОВАТЬСЯ';
        authSwitch.innerText = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
    };

    authSubmitBtn.onclick = () => {
        const username = authUsername.value.trim();
        const password = authPassword.value.trim();
        if (!username || !password) {
            alert('Заполните все поля');
            return;
        }
        if (isLoginMode) {
            if (login(username, password)) {
                authOverlay.classList.add('hidden');
                isLoggedIn = true;
                currentUser = username;
                myName = username;
                playerNameInput.value = myName;
                socket.emit('set-user', { username: currentUser, socketId: socket.id });
                location.reload();
            }
        } else {
            if (register(username, password)) {
                isLoginMode = true;
                authTitle.innerText = 'ВХОД';
                authSubmitBtn.innerText = 'ВОЙТИ';
                authSwitch.innerText = 'Нет аккаунта? Зарегистрироваться';
                authUsername.value = '';
                authPassword.value = '';
            }
        }
    };

    // Socket events
    socket.on('connect', () => {
        myId = socket.id;
        if (currentUser) {
            socket.emit('set-user', { username: currentUser, socketId: socket.id });
        }
    });

    socket.on('update-rooms', (rooms) => updateRoomsList(rooms));

    socket.on('room-created', (data) => {
        currentRoomId = data.roomId;
        isCreator = true;
        statusMsgDiv.innerText = `✅ Комната ${currentRoomId} готова. Ожидай игроков, потом СТАРТ.`;
        startGameBtn.classList.remove('hidden');
        updatePlayersUI(data.players);
    });

    socket.on('players-update', (players) => {
        currentPlayers = players;
        updatePlayersUI(players);
    });

    socket.on('game-start', (data) => {
        gameStarted = true;
        currentPlayers = data.players;
        updatePlayersUI(currentPlayers);
        myTurn = (data.firstPlayerId === myId);
        if (myTurn) enableShoot(true);
        else enableShoot(false);
        startGameBtn.classList.add('hidden');
        updateTurnHighlight();
        if (myTurn) statusMsgDiv.innerText = "🔫 ТВОЙ ХОД! ЖМИ ВЫСТРЕЛ! 🔫";
        else statusMsgDiv.innerText = "⏳ Ожидаем ход другого игрока... ⏳";
    });

    socket.on('turn-update', (data) => {
        if (!gameStarted) return;
        myTurn = (data.playerId === myId);
        if (myTurn) {
            enableShoot(true);
            statusMsgDiv.innerText = "🔫 ТВОЯ ОЧЕРЕДЬ! СТРЕЛЯЙ! 🔫";
        } else {
            enableShoot(false);
            statusMsgDiv.innerText = "⌛ Ждём оппонента...";
        }
        updateTurnHighlight();
    });

    socket.on('shot-fired', (data) => {
        if (data.isDead) {
            gunIconSpan.innerHTML = "💀 💥 💀";
            if (data.playerId === myId) {
                statusMsgDiv.innerText = "💀 ТЫ ПРОИГРАЛ! 💀";
                enableShoot(false);
                playScreamer();
            } else {
                statusMsgDiv.innerText = "💀 ИГРОК ВЫБЫЛ! 💀";
            }
        } else {
            gunIconSpan.innerHTML = "🔫 ЩЕЛЧОК! 🔫";
            setTimeout(() => gunIconSpan.innerHTML = "🔫 💀 🔫", 500);
            statusMsgDiv.innerText = "🍀 Осечка... Живой! 🍀";
        }
    });

    socket.on('player-dead', (data) => {
        currentPlayers = data.playersLeft;
        updatePlayersUI(currentPlayers);
        if (data.playerId === myId) {
            gameStarted = false;
            enableShoot(false);
            statusMsgDiv.innerText = "💀 ТЫ ВЫЛЕТЕЛ. ИГРА ОКОНЧЕНА. 💀";
        } else {
            statusMsgDiv.innerText = `☠️ Осталось: ${currentPlayers.length} чел. ☠️`;
            if (data.currentTurnId === myId) {
                myTurn = true;
                enableShoot(true);
                statusMsgDiv.innerText = "🔫 ТВОЙ ХОД! СТРЕЛЯЙ! 🔫";
            }
            updateTurnHighlight();
        }
    });

    socket.on('game-over', (data) => {
        gameStarted = false;
        enableShoot(false);
        statusMsgDiv.innerText = data.winner ? `🏆 ПОБЕДИТЕЛЬ: ${data.winner}! 🏆` : "💀 ВСЕ МЕРТВЫ. 💀";
        startGameBtn.classList.add('hidden');
        setTimeout(() => location.reload(), 5000);
    });

    socket.on('error', (msg) => alert(msg));

    function updatePlayersUI(players) {
        playersListDiv.innerHTML = '';
        players.forEach(p => {
            const chip = document.createElement('div');
            chip.className = 'player-chip';
            if (p.id === myId && p.isCreator) chip.classList.add('creator');
            chip.innerText = p.name + (p.isCreator ? ' 👑' : '');
            if (gameStarted && window.currentTurnId === p.id) chip.classList.add('active');
            playersListDiv.appendChild(chip);
        });
    }

    function updateTurnHighlight() {
        const chips = document.querySelectorAll('.player-chip');
        chips.forEach((chip, idx) => {
            chip.classList.remove('active');
            if (gameStarted && currentPlayers[idx] && currentPlayers[idx].id === window.currentTurnId) {
                chip.classList.add('active');
            }
        });
    }

    function enableShoot(enabled) {
        if (enabled) {
            shootBtn.classList.remove('disabled');
            shootBtn.disabled = false;
        } else {
            shootBtn.classList.add('disabled');
            shootBtn.disabled = true;
        }
    }

    socket.on('turn-update', (data) => {
        window.currentTurnId = data.playerId;
        updateTurnHighlight();
    });

    checkAutoLogin();
</script>
</body>
</html>
