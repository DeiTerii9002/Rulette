<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russian Roulette</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: linear-gradient(145deg, #1a3c2c, #0e2a1f);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app {
            max-width: 1200px;
            width: 100%;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .rooms-panel {
            background: #2d221c;
            border-radius: 30px;
            padding: 20px;
            width: 280px;
            border: 1px solid #b87a4f;
        }
        .rooms-panel h3 { color: #f5e2b9; text-align: center; margin-bottom: 15px; }
        .room-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        .room-item {
            background: #1e1713;
            padding: 10px;
            border-radius: 20px;
            color: #f0cba0;
            border: 1px solid #bb8855;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .room-item:hover { background: #b3592c; color: white; }
        .room-item.disabled { opacity: 0.5; cursor: not-allowed; }
        input, button {
            background: #2e241f;
            border: 2px solid #c9864b;
            padding: 10px;
            border-radius: 30px;
            color: #ffefcf;
            font-family: monospace;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
        }
        button {
            background: #b3592c;
            cursor: pointer;
        }
        button:hover { opacity: 0.8; }
        .game-panel {
            background: #2d221c;
            border-radius: 30px;
            padding: 20px;
            flex: 1;
            border: 1px solid #b87a4f;
        }
        .players { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        .player {
            background: #45342b;
            padding: 10px 20px;
            border-radius: 30px;
            color: #f0cba0;
            border-left: 5px solid #d49152;
        }
        .player.active { background: #8b4513; border-left-color: gold; box-shadow: 0 0 10px gold; }
        .status {
            background: #000000aa;
            padding: 20px;
            border-radius: 30px;
            text-align: center;
            font-size: 24px;
            color: #fadfaa;
            margin: 15px 0;
        }
        .gun { font-size: 60px; text-align: center; padding: 20px; }
        .shoot-btn { font-size: 24px; padding: 15px; background: #ac3e1c; width: 80%; display: block; margin: 20px auto; }
        .shoot-btn.disabled { opacity: 0.5; cursor: not-allowed; }
        .screamer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 9999; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: 0s;
        }
        .screamer.active { opacity: 1; visibility: visible; }
        .screamer img { width: 100%; height: 100%; object-fit: cover; }
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
        }
        .auth-box {
            background: #2d221c; border: 2px solid #b87a4f; border-radius: 50px;
            padding: 40px; width: 350px; text-align: center;
        }
        .auth-box h2 { color: #f5e2b9; margin-bottom: 20px; }
        .hidden { display: none; }
        .code { text-align: center; margin: 10px 0; font-size: 20px; color: gold; }
        .back-btn { margin-top: 10px; background: #3a2a22; }
    </style>
</head>
<body>
<div class="app">
    <div class="rooms-panel">
        <h3>💀 КОМНАТЫ 💀</h3>
        <div id="roomsList" class="room-list"></div>
        <input type="text" id="roomCode" placeholder="Код комнаты">
        <button id="joinByCodeBtn">🔍 ВОЙТИ ПО КОДУ</button>
        <button id="createRoomBtn">🔪 СОЗДАТЬ КОМНАТУ</button>
        <button id="logoutBtn" class="back-btn">🚪 ВЫЙТИ</button>
    </div>
    <div class="game-panel" id="gamePanel" style="display: none;">
        <div id="playersList" class="players"></div>
        <div class="code" id="roomCodeDisplay"></div>
        <div id="statusMsg" class="status">Ожидание...</div>
        <div class="gun" id="gunIcon">🔫 💀 🔫</div>
        <button id="startBtn" class="start-btn" style="display: none;">⚔️ СТАРТ ИГРЫ</button>
        <button id="shootBtn" class="shoot-btn disabled" disabled>💀 ВЫСТРЕЛИТЬ</button>
        <button id="leaveBtn" class="back-btn">🏠 ВЫЙТИ ИЗ КОМНАТЫ</button>
    </div>
</div>

<div id="screamer" class="screamer">
    <img src="/scary.jpeg" alt="SCREAMER">
</div>

<div id="authOverlay" class="auth-overlay">
    <div class="auth-box">
        <h2 id="authTitle">ВХОД</h2>
        <input type="text" id="authLogin" placeholder="Логин">
        <input type="password" id="authPassword" placeholder="Пароль">
        <button id="authBtn">ВОЙТИ</button>
        <div id="authToggle" style="margin-top: 15px; color: #f0cba0; cursor: pointer;">Нет аккаунта? Зарегистрироваться</div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    
    // Состояние
    let loggedIn = false;
    let currentUser = null;
    let currentRoom = null;
    let isCreator = false;
    let gameStarted = false;
    let myTurn = false;
    let players = [];
    let turnPlayerId = null;
    let myId = null;

    // DOM
    const authOverlay = document.getElementById('authOverlay');
    const authTitle = document.getElementById('authTitle');
    const authLogin = document.getElementById('authLogin');
    const authPassword = document.getElementById('authPassword');
    const authBtn = document.getElementById('authBtn');
    const authToggle = document.getElementById('authToggle');
    const roomsListDiv = document.getElementById('roomsList');
    const gamePanel = document.getElementById('gamePanel');
    const playersListDiv = document.getElementById('playersList');
    const statusMsgDiv = document.getElementById('statusMsg');
    const startBtn = document.getElementById('startBtn');
    const shootBtn = document.getElementById('shootBtn');
    const gunIcon = document.getElementById('gunIcon');
    const roomCodeDisplay = document.getElementById('roomCodeDisplay');
    const leaveBtn = document.getElementById('leaveBtn');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const joinByCodeBtn = document.getElementById('joinByCodeBtn');
    const roomCodeInput = document.getElementById('roomCode');
    const logoutBtn = document.getElementById('logoutBtn');
    const screamer = document.getElementById('screamer');

    let isLoginMode = true;

    // Авторизация
    function loadUsers() {
        const data = localStorage.getItem('rr_users');
        return data ? JSON.parse(data) : {};
    }
    function saveUsers(users) { localStorage.setItem('rr_users', JSON.stringify(users)); }
    function register(user, pass) {
        const users = loadUsers();
        if (users[user]) { alert('Логин занят'); return false; }
        users[user] = pass;
        saveUsers(users);
        alert('Регистрация успешна! Теперь войдите.');
        return true;
    }
    function login(user, pass) {
        const users = loadUsers();
        if (users[user] === pass) return user;
        alert('Неверный логин или пароль');
        return null;
    }

    authToggle.onclick = () => {
        isLoginMode = !isLoginMode;
        authTitle.innerText = isLoginMode ? 'ВХОД' : 'РЕГИСТРАЦИЯ';
        authBtn.innerText = isLoginMode ? 'ВОЙТИ' : 'ЗАРЕГИСТРИРОВАТЬСЯ';
        authToggle.innerText = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
    };

    authBtn.onclick = () => {
        const user = authLogin.value.trim();
        const pass = authPassword.value.trim();
        if (!user || !pass) { alert('Заполните поля'); return; }
        if (isLoginMode) {
            const res = login(user, pass);
            if (res) {
                currentUser = res;
                loggedIn = true;
                authOverlay.classList.add('hidden');
                socket.emit('set-user', currentUser);
                socket.emit('get-rooms');
            }
        } else {
            if (register(user, pass)) {
                isLoginMode = true;
                authTitle.innerText = 'ВХОД';
                authBtn.innerText = 'ВОЙТИ';
                authToggle.innerText = 'Нет аккаунта? Зарегистрироваться';
                authLogin.value = '';
                authPassword.value = '';
            }
        }
    };

    // Скример
    function playScreamer() {
        screamer.classList.add('active');
        try { new Audio('https://www.myinstants.com/media/sounds/scream-soundeffect.mp3').play().catch(e=>{}); } catch(e) {}
        setTimeout(() => screamer.classList.remove('active'), 1000);
    }

    // UI обновления
    function updateRoomsList(rooms) {
        roomsListDiv.innerHTML = '';
        rooms.forEach(room => {
            const div = document.createElement('div');
            div.className = 'room-item';
            div.innerHTML = `<span>🎲 ${room.id}</span><span>👥 ${room.playerCount}/6</span>`;
            if (!room.inGame) {
                div.onclick = () => {
                    if (currentRoom) { alert('Вы уже в комнате'); return; }
                    socket.emit('join-room', room.id);
                };
            } else div.classList.add('disabled');
            roomsListDiv.appendChild(div);
        });
    }

    function updatePlayersUI() {
        playersListDiv.innerHTML = '';
        players.forEach(p => {
            const chip = document.createElement('div');
            chip.className = 'player';
            if (gameStarted && turnPlayerId === p.id) chip.classList.add('active');
            chip.innerText = p.name + (p.id === myId && isCreator ? ' 👑' : '');
            playersListDiv.appendChild(chip);
        });
    }

    function enableShoot(enabled) {
        if (enabled) {
            shootBtn.classList.remove('disabled');
            shootBtn.disabled = false;
        } else {
            shootBtn.classList.add('disabled');
            shootBtn.disabled = true;
        }
    }

    // Обработчики кнопок
    createRoomBtn.onclick = () => {
        if (!loggedIn) { alert('Войдите сначала'); return; }
        if (currentRoom) { alert('Вы уже в комнате'); return; }
        socket.emit('create-room');
    };

    joinByCodeBtn.onclick = () => {
        if (!loggedIn) { alert('Войдите сначала'); return; }
        if (currentRoom) { alert('Вы уже в комнате'); return; }
        const code = roomCodeInput.value.trim().toUpperCase();
        if (!code) { alert('Введите код'); return; }
        socket.emit('join-room', code);
        roomCodeInput.value = '';
    };

    startBtn.onclick = () => {
        if (isCreator && !gameStarted) socket.emit('start-game');
    };

    shootBtn.onclick = () => {
        if (gameStarted && myTurn) socket.emit('shoot');
    };

    leaveBtn.onclick = () => {
        socket.emit('leave-room');
        gamePanel.style.display = 'none';
        currentRoom = null;
        isCreator = false;
        gameStarted = false;
        myTurn = false;
        players = [];
        socket.emit('get-rooms');
    };

    logoutBtn.onclick = () => {
        loggedIn = false;
        currentUser = null;
        currentRoom = null;
        gamePanel.style.display = 'none';
        authOverlay.classList.remove('hidden');
        socket.emit('leave-room');
        location.reload();
    };

    // Сокеты
    socket.on('connect', () => {
        myId = socket.id;
        if (loggedIn && currentUser) socket.emit('set-user', currentUser);
    });

    socket.on('user-set', (user) => { console.log('User set:', user); });

    socket.on('rooms-list', (rooms) => updateRoomsList(rooms));

    socket.on('room-created', (roomId) => {
        currentRoom = roomId;
        isCreator = true;
        roomCodeDisplay.innerText = `Код: ${roomId}`;
        statusMsgDiv.innerText = `Комната ${roomId} создана. Ждём игроков.`;
        startBtn.style.display = 'block';
        gamePanel.style.display = 'block';
        socket.emit('get-rooms');
    });

    socket.on('joined-room', (roomId) => {
        currentRoom = roomId;
        isCreator = false;
        roomCodeDisplay.innerText = `Код: ${roomId}`;
        statusMsgDiv.innerText = `Вы вошли в комнату ${roomId}`;
        startBtn.style.display = 'none';
        gamePanel.style.display = 'block';
        socket.emit('get-rooms');
    });

    socket.on('room-players', (playersList) => {
        players = playersList;
        updatePlayersUI();
    });

    socket.on('game-started', (data) => {
        gameStarted = true;
        players = data.players;
        myTurn = (data.firstPlayer === myId);
        updatePlayersUI();
        enableShoot(myTurn);
        startBtn.style.display = 'none';
        statusMsgDiv.innerText = myTurn ? "ТВОЙ ХОД! СТРЕЛЯЙ!" : "Ждём ход другого игрока...";
    });

    socket.on('turn-change', (data) => {
        if (!gameStarted) return;
        myTurn = (data.player === myId);
        turnPlayerId = data.player;
        enableShoot(myTurn);
        updatePlayersUI();
        statusMsgDiv.innerText = myTurn ? "ТВОЙ ХОД! СТРЕЛЯЙ!" : "Ждём ход другого игрока...";
    });

    socket.on('shot-result', (data) => {
        if (data.dead) {
            gunIcon.innerHTML = "💀 💥 💀";
            if (data.player === myId) {
                statusMsgDiv.innerText = "ТЫ УМЕР!";
                enableShoot(false);
                playScreamer();
                setTimeout(() => location.reload(), 2000);
            } else {
                statusMsgDiv.innerText = "Игрок выбыл!";
            }
        } else {
            gunIcon.innerHTML = "🔫 ЩЕЛЧОК!";
            setTimeout(() => gunIcon.innerHTML = "🔫 💀 🔫", 500);
        }
    });

    socket.on('player-left', (data) => {
        players = data.players;
        updatePlayersUI();
    });

    socket.on('game-ended', (data) => {
        gameStarted = false;
        if (data.winner) statusMsgDiv.innerText = `ПОБЕДИТЕЛЬ: ${data.winner}!`;
        else statusMsgDiv.innerText = "ИГРА ОКОНЧЕНА";
        enableShoot(false);
        startBtn.style.display = 'none';
        setTimeout(() => location.reload(), 3000);
    });

    socket.on('left-room', () => {
        currentRoom = null;
        gamePanel.style.display = 'none';
        socket.emit('get-rooms');
    });

    socket.on('error', (msg) => { alert(msg); });

    // Начало
    authOverlay.classList.remove('hidden');
</script>
</body>
</html>
