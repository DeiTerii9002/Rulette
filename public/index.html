<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Russian Roulette</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: linear-gradient(145deg, #1a3c2c, #0e2a1f);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            gap: 20px;
        }
        .rooms-panel {
            width: 280px;
            background: #2d221c;
            border-radius: 40px;
            padding: 20px;
            border: 1px solid #b87a4f;
            height: fit-content;
        }
        .rooms-panel h3 { color: #f5e2b9; text-align: center; margin: 0 0 15px; }
        .room-list { display: flex; flex-direction: column; gap: 10px; }
        .room-item {
            background: #1e1713;
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            color: #f0cba0;
            border: 1px solid #bb8855;
            transition: 0.2s;
        }
        .room-item:hover { background: #b3592c; color: white; transform: scale(1.02); }
        .room-item.in-game { opacity: 0.6; cursor: not-allowed; background: #5f4a3b; }
        .create-btn {
            width: 100%;
            background: #b3592c;
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
        .game-container {
            flex: 1;
            background: #2d221c;
            border-radius: 70px;
            padding: 30px 25px;
            border: 1px solid #b87a4f;
        }
        .join-area { text-align: center; margin-bottom: 20px; }
        .join-input {
            background: #2e241f;
            border: 2px solid #c9864b;
            padding: 12px 18px;
            border-radius: 60px;
            font-size: 18px;
            color: #ffefcf;
            margin-right: 10px;
            width: 200px;
        }
        .join-btn, .start-btn {
            background: #b3592c;
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }
        .players-list { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 15px 0; }
        .player-chip {
            background: #45342b;
            padding: 10px 18px;
            border-radius: 50px;
            color: #f0cba0;
            font-weight: bold;
            border-left: 6px solid #d49152;
            transition: all 0.2s;
        }
        .player-chip.active { 
            background: #8b4513; 
            border-left-color: gold; 
            box-shadow: 0 0 12px #ffa559;
            color: #ffefb9;
            transform: scale(1.05);
        }
        .player-chip.creator { border-right: 3px solid gold; }
        .status-message {
            background: #000000aa;
            backdrop-filter: blur(8px);
            border-radius: 46px;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            color: #fadfaa;
            margin: 15px 0;
            font-weight: bold;
        }
        .gun { text-align: center; font-size: 70px; letter-spacing: 16px; background: #362217; border-radius: 80px; padding: 15px; margin: 10px 0; }
        .shoot-btn {
            background: #ac3e1c;
            width: 80%;
            padding: 18px;
            font-size: 28px;
            font-weight: bold;
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            display: block;
            margin: 20px auto;
        }
        .shoot-btn.disabled { background: #5f4a3b; opacity: 0.6; cursor: not-allowed; }
        .hidden { display: none; }
        .turn-indicator {
            background: #000000cc;
            padding: 8px 15px;
            border-radius: 40px;
            display: inline-block;
            margin-bottom: 15px;
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="rooms-panel">
    <h3>🏠 ROOMS</h3>
    <div class="room-list" id="roomList"></div>
    <button class="create-btn" id="createRoomBtn">+ CREATE ROOM</button>
</div>
<div class="game-container" id="gameContainer">
    <div id="joinRoomArea" class="join-area">
        <input type="text" id="playerNameInput" class="join-input" placeholder="Your name">
        <button id="joinRoomBtn" class="join-btn">JOIN ROOM</button>
    </div>
    <div id="gameArea" style="display:none;">
        <div class="players-list" id="playersList"></div>
        <div class="status-message" id="statusMsg">Waiting...</div>
        <div class="gun" id="gunIcon">🔫 💀 🔫</div>
        <button id="startGameBtn" class="start-btn hidden">START GAME</button>
        <button id="shootBtn" class="shoot-btn disabled" disabled>PULL TRIGGER</button>
    </div>
</div>

<script>
    const socket = io();
    let currentRoomId = null;
    let myName = null;
    let myId = null;
    let isCreator = false;
    let gameStarted = false;
    let myTurn = false;
    let currentPlayers = [];

    const roomListDiv = document.getElementById('roomList');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const joinRoomArea = document.getElementById('joinRoomArea');
    const gameArea = document.getElementById('gameArea');
    const playerNameInput = document.getElementById('playerNameInput');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const playersListDiv = document.getElementById('playersList');
    const statusMsgDiv = document.getElementById('statusMsg');
    const startGameBtn = document.getElementById('startGameBtn');
    const shootBtn = document.getElementById('shootBtn');
    const gunIconSpan = document.getElementById('gunIcon');

    function updateRoomsList(rooms) {
        roomListDiv.innerHTML = '';
        rooms.forEach(room => {
            const div = document.createElement('div');
            div.className = 'room-item' + (room.inGame ? ' in-game' : '');
            div.innerHTML = `🎲 Room ${room.id} (${room.playerCount}/6)`;
            if (!room.inGame) div.onclick = () => promptJoinRoom(room.id);
            roomListDiv.appendChild(div);
        });
    }

    function promptJoinRoom(roomId) {
        if (!myName) {
            const name = prompt('Enter your name:');
            if (!name) return;
            myName = name;
            playerNameInput.value = myName;
        }
        currentRoomId = roomId;
        socket.emit('join-room', { roomId, playerName: myName });
        joinRoomArea.style.display = 'none';
        gameArea.style.display = 'block';
        statusMsgDiv.innerText = 'Joining room...';
    }

    createRoomBtn.onclick = () => {
        let name = playerNameInput.value.trim();
        if (!name) name = prompt('Enter your name:');
        if (!name) return;
        myName = name;
        socket.emit('create-room', myName);
        joinRoomArea.style.display = 'none';
        gameArea.style.display = 'block';
    };

    joinRoomBtn.onclick = () => {
        if (!currentRoomId) {
            alert('Select a room from the list first');
            return;
        }
        const name = playerNameInput.value.trim();
        if (!name) { alert('Enter your name'); return; }
        myName = name;
        socket.emit('join-room', { roomId: currentRoomId, playerName: myName });
        joinRoomArea.style.display = 'none';
        gameArea.style.display = 'block';
    };

    startGameBtn.onclick = () => { if (isCreator && !gameStarted) socket.emit('start-game', currentRoomId); };
    shootBtn.onclick = () => { if (gameStarted && myTurn) socket.emit('shoot', currentRoomId); };

    socket.on('connect', () => { myId = socket.id; });
    
    socket.on('update-rooms', (rooms) => updateRoomsList(rooms));
    
    socket.on('room-created', (data) => {
        currentRoomId = data.roomId;
        isCreator = true;
        myId = socket.id;
        statusMsgDiv.innerText = `Room ${currentRoomId} created. Wait for players, then press START.`;
        startGameBtn.classList.remove('hidden');
        updatePlayersUI(data.players);
    });
    
    socket.on('players-update', (players) => {
        currentPlayers = players;
        updatePlayersUI(players);
    });
    
    socket.on('game-start', (data) => {
        gameStarted = true;
        currentPlayers = data.players;
        updatePlayersUI(currentPlayers);
        myTurn = (data.firstPlayerId === myId);
        if (myTurn) enableShoot(true);
        else enableShoot(false);
        startGameBtn.classList.add('hidden');
        updateTurnHighlight();
        if (myTurn) statusMsgDiv.innerText = "🔫 YOUR TURN! Pull the trigger! 🔫";
        else statusMsgDiv.innerText = "⏳ Waiting for other player... ⏳";
    });
    
    socket.on('turn-update', (data) => {
        if (!gameStarted) return;
        myTurn = (data.playerId === myId);
        if (myTurn) { 
            enableShoot(true); 
            statusMsgDiv.innerText = "🔫 YOUR TURN! Pull the trigger! 🔫";
        } else { 
            enableShoot(false); 
            statusMsgDiv.innerText = "⏳ Waiting for opponent... ⏳";
        }
        updateTurnHighlight();
    });
    
    socket.on('shot-fired', (data) => {
        if (data.isDead) {
            gunIconSpan.innerHTML = "💀 💥 💀";
            if (data.playerId === myId) { 
                statusMsgDiv.innerText = "💀 YOU DIED! 💀"; 
                enableShoot(false);
            } else { 
                statusMsgDiv.innerText = "💀 A player was eliminated! 💀";
            }
        } else { 
            gunIconSpan.innerHTML = "🔫 CLICK! 🔫"; 
            setTimeout(() => gunIconSpan.innerHTML = "🔫 💀 🔫", 500);
            statusMsgDiv.innerText = "🍀 CLICK... Lucky! 🍀";
        }
    });
    
    socket.on('player-dead', (data) => {
        currentPlayers = data.playersLeft;
        updatePlayersUI(currentPlayers);
        if (data.playerId === myId) { 
            gameStarted = false; 
            enableShoot(false); 
            statusMsgDiv.innerText = "💀 Game over. You lost. 💀";
        } else { 
            statusMsgDiv.innerText = `☠️ ${currentPlayers.length} players remain. ☠️`;
            if (data.currentTurnId === myId) {
                myTurn = true;
                enableShoot(true);
                statusMsgDiv.innerText = "🔫 YOUR TURN! Pull the trigger! 🔫";
            }
            updateTurnHighlight();
        }
    });
    
    socket.on('game-over', (data) => {
        gameStarted = false;
        enableShoot(false);
        statusMsgDiv.innerText = data.winner ? `🏆 WINNER: ${data.winner}! 🏆` : "💀 Game over! No survivors. 💀";
        startGameBtn.classList.add('hidden');
        setTimeout(() => location.reload(), 5000);
    });
    
    socket.on('error', (msg) => { alert(msg); location.reload(); });

    function updatePlayersUI(players) {
        playersListDiv.innerHTML = '';
        players.forEach(p => {
            const chip = document.createElement('div');
            chip.className = 'player-chip';
            if (p.id === myId && p.isCreator) chip.classList.add('creator');
            chip.innerText = p.name + (p.isCreator ? ' 👑' : '');
            if (gameStarted && p.id === players[currentTurnIndex()]?.id) {
                chip.classList.add('active');
            }
            playersListDiv.appendChild(chip);
        });
    }
    
    function currentTurnIndex() {
        if (!gameStarted || !currentPlayers.length) return -1;
        return currentPlayers.findIndex(p => p.id === (window.currentTurnId || (myTurn ? myId : null)));
    }
    
    function updateTurnHighlight() {
        const chips = document.querySelectorAll('.player-chip');
        chips.forEach((chip, idx) => {
            chip.classList.remove('active');
            if (gameStarted && currentPlayers[idx] && currentPlayers[idx].id === (window.currentTurnId || (myTurn && gameStarted ? myId : null))) {
                chip.classList.add('active');
            }
        });
    }
    
    function enableShoot(enabled) {
        if (enabled) { 
            shootBtn.classList.remove('disabled'); 
            shootBtn.disabled = false; 
        } else { 
            shootBtn.classList.add('disabled'); 
            shootBtn.disabled = true; 
        }
    }
    
    window.updateTurnHighlight = updateTurnHighlight;
    window.currentTurnId = null;
    
    // Listen for turn updates to store current turn ID
    const originalTurnUpdate = socket.on;
    socket.on('turn-update', (data) => {
        window.currentTurnId = data.playerId;
        updateTurnHighlight();
    });
</script>
</body>
</html>
